services:
  postgres:
    image: postgres:16-alpine
    container_name: healthwatch-postgres
    environment:
      POSTGRES_DB: healthwatch
      POSTGRES_USER: healthwatch
      POSTGRES_PASSWORD: healthwatch
    ports:
      - "5432:5432"
    volumes:
      - healthwatch-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthwatch -d healthwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  healthwatch-postgres-data:
