spring:
  application:
    name: healthwatch-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthwatch}
    username: ${DB_USERNAME:healthwatch}
    password: ${DB_PASSWORD:healthwatch}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:30}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  detection: 
    z-threshold: 3.0
    consecutive-readings: 3

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
